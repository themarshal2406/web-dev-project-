<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <title>Document</title>
</head>
<body>
  <header class="header">
    <a href="#">
      <img src="logo.png" alt="YouTube Logo" class="youtube-logo" />
    </a>
    <form class="search-bar" id="searchForm">
      <input class="search-input" type="search" placeholder="Search" aria-label="Search" />
      <button type="submit" class="search-btn">
        <img src="magnify.svg" />
      </button>
    </form>
    <div class="menu-icons">
      <a href="#" onclick="openModal()">
        <img src="video-plus.svg" />
      </a>
      <a href="#">
        <img src="apps.svg" alt="Apps" />
      </a>
      <a href="#">
        <img src="bell.svg" alt="Notifications" />
      </a>
      <a href="#">
        <img class="menu-channel-icon" src="https://picsum.photos/36/36" alt="Your Channel" />
      </a>
    </div>
  </header>

  <!-- ADD VIDEO MODAL -->
<div id="addVideoModal" style="display:none; position:fixed; top:20%; left:35%; background:white; padding:20px; border:1px solid #ccc; z-index:1000;">
  <h3>Add Video</h3>
  
  <input id="title" placeholder="Video Title"><br><br>
  
  <button onclick="submitVideo()">Add</button>
  <button onclick="closeModal()">Cancel</button>
</div>
<div class="categories">
    <section class="category-section">
      <button class="category active">All</button>
      <button class="category">Category 1</button>
      <button class="category">Category 2</button>
      <button class="category">Category 3</button>
      <button class="category">Category 4</button>
      <button class="category">Category 5</button>
      <button class="category">Category 6</button>
      <button class="category">Category 7</button>
      <button class="category">Category 8</button>
      <button class="category">Category 9</button>
    </section>
  </div>
  <div class="videos">
    <section class="video-section">
      <article class="video-container">
        <a href="#" class="thumbnail" data-duration="12:24">
          <img class="thumbnail-image" src="https://picsum.photos/250/150" />
        </a>
        <div class="video-bottom-section">
          <a href="#">
            <img class="channel-icon" src="https://picsum.photos/36/36" />
          </a>
          <div class="video-details">
            <a href="#" class="video-title">Video Title</a>
            <a href="#" class="video-channel-name">Channel Name</a>
            <div class="video-metadata">
              <span>12K views</span>
              •
              <span>1 week ago</span>
            </div>
          </div>
        </div>
      </article>
      <article class="video-container">
        <a href="#" class="thumbnail" data-duration="12:24">
          <img class="thumbnail-image" src="https://picsum.photos/250/150" />
        </a>
        <div class="video-bottom-section">
          <a href="#">
            <img class="channel-icon" src="https://picsum.photos/36/36" />
          </a>
          <div class="video-details">
            <a href="#" class="video-title">Rishihood Vlog</a>
            <a href="#" class="video-channel-name">Rishihood</a>
            <div class="video-metadata">
              <span>12K views</span>
              •
              <span>1 week ago</span>
            </div>
          </div>
        </div>
      </article>
    </section>
 </div>
  <script src="style.js"></script>
</body>
